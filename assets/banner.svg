<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250" style="background: #f8fafc; border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradient (Soft Ice Blue to Lavender) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>

    <!-- Grid Line Gradient -->
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.2" />
    </linearGradient>

    <!-- 3D Soft Shadow Filter directly on icons -->
    <filter id="shadow-3d" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>

    <!-- Node.js Hexagon Face Gradient -->
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- MongoDB Left Gradient -->
    <linearGradient id="mongo-left-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- MongoDB Right Gradient -->
    <linearGradient id="mongo-right-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- AI Chip Surface Gradient -->
    <linearGradient id="ai-chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- ML Node Spherical Gradient -->
    <radialGradient id="ml-node-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="40%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </radialGradient>
  </defs>

  <style>
    /* Organic 2D drifting keyframe animations for tech icons */
    @keyframes float-1 {
      0%, 100% { transform: translate(0px, 0px); }
      33% { transform: translate(10px, -12px); }
      66% { transform: translate(-8px, 6px); }
    }
    @keyframes float-2 {
      0%, 100% { transform: translate(0px, 0px); }
      25% { transform: translate(-12px, 8px); }
      50% { transform: translate(6px, -10px); }
      75% { transform: translate(10px, 8px); }
    }
    @keyframes float-3 {
      0%, 100% { transform: translate(0px, 0px); }
      33% { transform: translate(-10px, -8px); }
      66% { transform: translate(12px, 6px); }
    }

    .float-node-1 { animation: float-1 6s ease-in-out infinite; }
    .float-node-2 { animation: float-2 8s ease-in-out infinite; }
    .float-node-3 { animation: float-3 7s ease-in-out infinite; }

    /* Modern clean typography with 3D text shadow */
    .title-text {
      font-size: 48px;
      font-weight: 900;
      fill: #0f172a;
      letter-spacing: 6px;
      text-shadow: 
        1px 1px 0px #e2e8f0, 
        2px 2px 0px #cbd5e1, 
        3px 3px 0px #cbd5e1, 
        4px 4px 8px rgba(15, 23, 42, 0.15);
    }
    
    .subtitle-text {
      font-size: 13px;
      fill: #475569;
      font-weight: 600;
      letter-spacing: 4px;
    }

    /* Sequential Typewriter animations */
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes blink-name {
      from, to { border-color: transparent; }
      50% { border-color: #0f172a; }
    }
    @keyframes blink-tagline {
      from, to { border-color: transparent; }
      50% { border-color: #4f46e5; }
    }

    .typewriter-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 40px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: 6px;
      text-shadow: 
        1px 1px 0px #e2e8f0, 
        2px 2px 0px #cbd5e1, 
        3px 3px 0px #cbd5e1, 
        4px 4px 8px rgba(15, 23, 42, 0.15);
      overflow: hidden;
      border-right: 4px solid #0f172a;
      white-space: nowrap;
      margin: 0 auto;
      display: inline-block;
      width: 0;
      animation: 
        typing 1.5s steps(14, end) forwards,
        blink-name 0.75s step-end 2 forwards;
    }

    .typewriter-tagline {
      font-family: 'Courier New', Courier, monospace;
      color: #4f46e5;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.15em;
      overflow: hidden;
      border-right: 3px solid transparent;
      white-space: nowrap;
      margin: 0 auto;
      display: inline-block;
      width: 0;
      animation: 
        typing 1.5s steps(20, end) 1.5s forwards,
        blink-tagline 0.75s step-end 1.5s infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bg-grad)" />

  <!-- Isometric Grid Lines in Background -->
  <g stroke="url(#grid-grad)" stroke-width="0.75" opacity="0.6">
    <path d="M-100,-50 L900,450 M-100,0 L900,500 M-100,50 L900,550 M-100,100 L900,600 M-100,150 L900,650 M-100,-100 L900,400 M-100,-150 L900,350 M-100,-200 L900,300" />
    <path d="M-100,300 L900,-200 M-100,250 L900,-250 M-100,200 L900,-300 M-100,150 L900,-350 M-100,350 L900,-150 M-100,400 L900,-100 M-100,450 L900,-50 M-100,500 L900,0" />
  </g>

  <!-- SCATTERED BACKGROUND 3D ICONS (Rendered behind the text layer) -->

  <!-- 1. Java Icon (x=80, y=60 - Top Left) -->
  <g transform="translate(80, 60)" opacity="0.45">
    <g class="float-node-1" filter="url(#shadow-3d)" style="animation-delay: -0s;">
      <g transform="scale(1.4) translate(0, -2)">
        <!-- 3D Extrusion -->
        <g transform="translate(1.5, 1.5)">
          <path d="M -6,-2 L -4,6 C -3,8 3,8 4,6 L 6,-2 Z" fill="#a61b07" />
          <ellipse cx="0" cy="8" rx="8" ry="2" fill="#2d4758" />
        </g>
        <!-- Front Face -->
        <path d="M -6,-2 L -4,6 C -3,8 3,8 4,6 L 6,-2 Z" fill="#ea2d12" />
        <path d="M 6,0 C 8,0 8,2 6,3" fill="none" stroke="#ea2d12" stroke-width="1.5" />
        <ellipse cx="0" cy="8" rx="8" ry="2" fill="#cbd5e1" />
        <!-- Steam -->
        <path d="M -3,-5 Q -5,-8 -2,-11" fill="none" stroke="#355265" stroke-width="1.5" />
        <path d="M 0,-5 Q 2,-8 -1,-11" fill="none" stroke="#355265" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- 2. HTML5 Icon (x=120, y=190 - Bottom Left) -->
  <g transform="translate(120, 190)" opacity="0.45">
    <g class="float-node-2" filter="url(#shadow-3d)" style="animation-delay: -1s;">
      <g transform="scale(1.4)">
        <!-- 3D Extrusion -->
        <g transform="translate(1.5, 1.5)">
          <path d="M -10 -12 L 10 -12 L 8 8 L 0 13 L -8 8 Z" fill="#a83214" />
        </g>
        <!-- Front Face -->
        <path d="M -10 -12 L 10 -12 L 8 8 L 0 13 L -8 8 Z" fill="#e34f26" />
        <path d="M 0 -12 L 0 13 L 8 8 L 10 -12 Z" fill="#f06529" />
        <path d="M -4 -6 H 0 V -3 H -4 V 3 H 0 V 6 L -3 5 L -3.5 1 H -6.5 L -5.5 8 L 0 10 L 5.5 8 L 6 -1 H -1 V -3 H 6 V -6 Z" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- 3. CSS3 Icon (x=240, y=55 - Left-Center Top) -->
  <g transform="translate(240, 55)" opacity="0.45">
    <g class="float-node-3" filter="url(#shadow-3d)" style="animation-delay: -2s;">
      <g transform="scale(1.4)">
        <!-- 3D Extrusion -->
        <g transform="translate(1.5, 1.5)">
          <path d="M -10 -12 L 10 -12 L 8 8 L 0 13 L -8 8 Z" fill="#0c4b78" />
        </g>
        <!-- Front Face -->
        <path d="M -10 -12 L 10 -12 L 8 8 L 0 13 L -8 8 Z" fill="#1572b6" />
        <path d="M 0 -12 L 0 13 L 8 8 L 10 -12 Z" fill="#33a9dc" />
        <!-- Stylized '3' instead of '5' -->
        <path d="M -5.5 -6 H 5.5 L 5 -2 H -1.5 L -1 1.5 H 4.5 L 3.8 8.5 L 0 10 L -4 8.5 L -4.5 5.5 H -1.5 L -1.2 7 L 0 7.5 L 1.2 7 L 1.5 4 H -4.5 Z" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- 4. JS Icon (x=280, y=195 - Left-Center Bottom) -->
  <g transform="translate(280, 195)" opacity="0.45">
    <g class="float-node-1" filter="url(#shadow-3d)" style="animation-delay: -3s;">
      <g transform="scale(0.85)">
        <!-- 3D Extrusion Side/Bottom -->
        <rect x="-20" y="-20" width="40" height="40" rx="5" fill="#bfa500" transform="translate(2.5, 2.5)" />
        <!-- Front Face -->
        <rect x="-20" y="-20" width="40" height="40" rx="5" fill="#f7df1e" stroke="#d4be0b" stroke-width="1" />
        <!-- Text Shadow (Extrusion) -->
        <text x="15" y="15" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" fill="#665900" text-anchor="end">JS</text>
        <!-- Text Front -->
        <text x="14" y="14" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" fill="#000000" text-anchor="end">JS</text>
      </g>
    </g>
  </g>

  <!-- 5. React Icon (x=400, y=50 - Center Top) -->
  <g transform="translate(400, 50)" opacity="0.45">
    <g class="float-node-2" filter="url(#shadow-3d)" style="animation-delay: -4s;">
      <g transform="scale(1.1)">
        <!-- 3D Extrusion Back Layer -->
        <g transform="translate(1.5, 1.5)">
          <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#1e3a8a" stroke-width="2.5" />
          <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#1e3a8a" stroke-width="2.5" transform="rotate(60)" />
          <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#1e3a8a" stroke-width="2.5" transform="rotate(120)" />
          <circle cx="0" cy="0" r="3.5" fill="#1e3a8a" />
        </g>
        <!-- Front Layer -->
        <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#0284c7" stroke-width="2.5" />
        <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#0284c7" stroke-width="2.5" transform="rotate(60)" />
        <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#0284c7" stroke-width="2.5" transform="rotate(120)" />
        <circle cx="0" cy="0" r="3.5" fill="#0284c7" />
      </g>
    </g>
  </g>

  <!-- 6. Node.js Icon (x=520, y=195 - Right-Center Bottom) -->
  <g transform="translate(520, 195)" opacity="0.45">
    <g class="float-node-3" filter="url(#shadow-3d)" style="animation-delay: -5s;">
      <g transform="scale(0.95)">
        <!-- 3D Extrusion -->
        <path d="M 0 -18 L 15.58 -9 L 15.58 9 L 0 18 L -15.58 9 L -15.58 -9 Z" fill="#14532d" transform="translate(2, 2)" />
        <!-- Front Face -->
        <path d="M 0 -18 L 15.58 -9 L 15.58 9 L 0 18 L -15.58 9 L -15.58 -9 Z" fill="url(#node-grad)" stroke="#166534" stroke-width="1" />
        <!-- White Leaf Contour in Center -->
        <path d="M 0 -10 C 3.5 -10 5.5 -6 5.5 0 C 5.5 5 3 8 0 8 C -3 8 -5.5 5 -5.5 0 C -5.5 -6 -3.5 -10 0 -10 Z" fill="#ffffff" opacity="0.9" />
        <!-- Small green inner detail to show leaf fold -->
        <path d="M 0 -6 C 1.5 -6 2.5 -3 2.5 0 C 2.5 2 1.5 4 0 4 Z" fill="#22c55e" />
      </g>
    </g>
  </g>

  <!-- 7. MongoDB Icon (x=560, y=55 - Right-Center Top) -->
  <g transform="translate(560, 55)" opacity="0.45">
    <g class="float-node-1" filter="url(#shadow-3d)" style="animation-delay: -6s;">
      <g transform="scale(0.95)">
        <!-- 3D Extrusion -->
        <path d="M 0 -18 C -12 -10 -12 10 0 18 C 12 10 12 -10 0 -18 Z" fill="#064e3b" transform="translate(2, 2)" />
        <!-- Front Left Half -->
        <path d="M 0 -18 C -12 -10 -12 10 0 18 Z" fill="url(#mongo-left-grad)" />
        <!-- Front Right Half -->
        <path d="M 0 -18 C 12 -10 12 10 0 18 Z" fill="url(#mongo-right-grad)" />
        <!-- Center Leaf Stripe -->
        <path d="M 0 -18 L 0 18" stroke="#a7f3d0" stroke-width="1.5" />
        <!-- MongoDB brown/orange accent at the bottom center -->
        <path d="M -2 6 C -2 12 2 12 2 6 Z" fill="#f59e0b" opacity="0.8" />
      </g>
    </g>
  </g>

  <!-- 8. AI Icon (x=680, y=190 - Bottom Right) -->
  <g transform="translate(680, 190)" opacity="0.45">
    <g class="float-node-2" filter="url(#shadow-3d)" style="animation-delay: -7s;">
      <g transform="scale(0.95)">
        <!-- 3D Legs Extrusion -->
        <g fill="#083344" transform="translate(1.5, 1.5)">
          <rect x="-18" y="-9" width="4" height="2" />
          <rect x="-18" y="-1" width="4" height="2" />
          <rect x="-18" y="7" width="4" height="2" />
          <rect x="14" y="-9" width="4" height="2" />
          <rect x="14" y="-1" width="4" height="2" />
          <rect x="14" y="7" width="4" height="2" />
          <rect x="-9" y="-18" width="2" height="4" />
          <rect x="-1" y="-18" width="2" height="4" />
          <rect x="7" y="-18" width="2" height="4" />
          <rect x="-9" y="14" width="2" height="4" />
          <rect x="-1" y="14" width="2" height="4" />
          <rect x="7" y="14" width="2" height="4" />
        </g>
        <!-- Front Legs -->
        <g fill="#22d3ee">
          <rect x="-18" y="-9" width="4" height="2" />
          <rect x="-18" y="-1" width="4" height="2" />
          <rect x="-18" y="7" width="4" height="2" />
          <rect x="14" y="-9" width="4" height="2" />
          <rect x="14" y="-1" width="4" height="2" />
          <rect x="14" y="7" width="4" height="2" />
          <rect x="-9" y="-18" width="2" height="4" />
          <rect x="-1" y="-18" width="2" height="4" />
          <rect x="7" y="-18" width="2" height="4" />
          <rect x="-9" y="14" width="2" height="4" />
          <rect x="-1" y="14" width="2" height="4" />
          <rect x="7" y="14" width="2" height="4" />
        </g>
        <!-- 3D Extrusion Base -->
        <rect x="-15" y="-15" width="30" height="30" rx="3" fill="#083344" transform="translate(1.5, 1.5)" />
        <!-- Front Face -->
        <rect x="-15" y="-15" width="30" height="30" rx="3" fill="url(#ai-chip-grad)" stroke="#0891b2" stroke-width="1.2" />
        <!-- Microchip Details -->
        <rect x="-10" y="-10" width="20" height="20" rx="2" fill="none" stroke="#22d3ee" stroke-width="0.75" opacity="0.6" />
        <!-- Text AI -->
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#cffafe" text-anchor="middle" letter-spacing="1">AI</text>
      </g>
    </g>
  </g>

  <!-- 9. ML Icon (x=720, y=60 - Top Right) -->
  <g transform="translate(720, 60)" opacity="0.45">
    <g class="float-node-3" filter="url(#shadow-3d)" style="animation-delay: -8s;">
      <g transform="scale(0.95) translate(0, -1)">
        <!-- 3D Extrusion for Synapse Lines -->
        <g stroke="#701a75" stroke-width="1.5" transform="translate(1.5, 1.5)">
          <line x1="-12" y1="-10" x2="0" y2="-12" />
          <line x1="-12" y1="-10" x2="0" y2="0" />
          <line x1="-12" y1="10" x2="0" y2="0" />
          <line x1="-12" y1="10" x2="0" y2="12" />
          <line x1="0" y1="-12" x2="12" y2="0" />
          <line x1="0" y1="0" x2="12" y2="0" />
          <line x1="0" y1="12" x2="12" y2="0" />
        </g>
        <!-- Front Synapse Lines -->
        <g stroke="#d946ef" stroke-width="1.5" opacity="0.9">
          <line x1="-12" y1="-10" x2="0" y2="-12" />
          <line x1="-12" y1="-10" x2="0" y2="0" />
          <line x1="-12" y1="10" x2="0" y2="0" />
          <line x1="-12" y1="10" x2="0" y2="12" />
          <line x1="0" y1="-12" x2="12" y2="0" />
          <line x1="0" y1="0" x2="12" y2="0" />
          <line x1="0" y1="12" x2="12" y2="0" />
        </g>
        <!-- 3D Extrusion Spheres (pink) -->
        <g fill="#701a75" transform="translate(1.2, 1.2)">
          <circle cx="-12" cy="-10" r="4.5" />
          <circle cx="-12" cy="10" r="4.5" />
          <circle cx="0" cy="-12" r="4.5" />
          <circle cx="0" cy="0" r="4.5" />
          <circle cx="0" cy="12" r="4.5" />
          <circle cx="12" cy="0" r="4.5" />
        </g>
        <!-- Front Spheres -->
        <g fill="url(#ml-node-grad)">
          <circle cx="-12" cy="-10" r="4.5" />
          <circle cx="-12" cy="10" r="4.5" />
          <circle cx="0" cy="-12" r="4.5" />
          <circle cx="0" cy="0" r="4.5" />
          <circle cx="0" cy="12" r="4.5" />
          <circle cx="12" cy="0" r="4.5" />
        </g>
      </g>
    </g>
  </g>

  <!-- CENTERED MAIN CARD CONTENT (Placed on top of the icons) -->
  <g transform="translate(400, 105)" text-anchor="middle">
    <!-- Title Container -->
    <foreignObject x="-300" y="-35" width="600" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="text-align: center;">
        <span class="typewriter-name">KARTHIGASHRI R</span>
      </div>
    </foreignObject>
    
    <!-- Typing tagline container -->
    <foreignObject x="-300" y="25" width="600" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" style="text-align: center;">
        <span class="typewriter-tagline">Full-Stack Developer</span>
      </div>
    </foreignObject>
  </g>

  <!-- Top and bottom thin aesthetic borders -->
  <rect x="0" y="0" width="800" height="4" fill="#3b82f6" />
  <rect x="0" y="246" width="800" height="4" fill="#8b5cf6" />
</svg>
